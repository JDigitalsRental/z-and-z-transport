<!DOCTYPE html>
<html lang="en">
 <head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1" name="viewport"/>
  <title>
   Z &amp; Z Transport | Admin Dashboard
  </title>
  <link href="admin-styles.css" rel="stylesheet"/>
 </head>
 <body>
  <header>
   <div>
    <h1>
     Z &amp; Z TRANSPORT SERVICES
    </h1>
    <small>
     SECURE ADMIN DASHBOARD • V1
    </small>
   </div>
   <div>
    <span class="muted" id="adminEmail">
    </span>
    <button class="hide" id="logout">
     Log out
    </button>
   </div>
  </header>
  <main>
   <section class="panel login" id="loginSection">
    <h2>
     Admin sign in
    </h2>
    <p class="note">
     Use the Firebase Email/Password admin account you created for this project.
    </p>
    <form id="loginForm">
     <label class="field" for="email">
      Email
     </label>
     <input autocomplete="username" id="email" required="" type="email"/>
     <label class="field" for="password">
      Password
     </label>
     <input autocomplete="current-password" id="password" required="" type="password"/>
     <p>
      <button class="primary" id="loginBtn" type="submit">
       Sign in
      </button>
     </p>
    </form>
    <p class="message" id="loginMsg" role="status">
    </p>
   </section>
   <section class="hide" id="dashboard">
    <div class="top">
     <div>
      <h2>
       Booking inquiries
      </h2>
      <p class="note">
       Live updates from Firebase • Customer inquiries are not confirmed until approved.
      </p>
     </div>
     <button id="exportBtn">
      Export visible CSV
     </button>
    </div>
    <div class="stats">
     <div class="stat">
      Total
      <strong id="total">
       0
      </strong>
     </div>
     <div class="stat">
      Pending
      <strong id="pending">
       0
      </strong>
     </div>
     <div class="stat">
      Confirmed
      <strong id="confirmed">
       0
      </strong>
     </div>
     <div class="stat">
      Completed
      <strong id="completed">
       0
      </strong>
     </div>
    </div>
    <div class="panel">
     <div class="tools">
      <input aria-label="Search bookings" id="search" placeholder="Search customer, phone, vehicle, destination…"/>
      <select aria-label="Filter by status" id="filter">
       <option value="all">
        All statuses
       </option>
       <option value="pending">
        Pending
       </option>
       <option value="confirmed">
        Confirmed
       </option>
       <option value="declined">
        Declined
       </option>
       <option value="completed">
        Completed
       </option>
      </select>
      <button id="refresh">
       Refresh
      </button>
     </div>
     <p class="message" id="dashboardMsg" role="status">
     </p>
     <div class="list" id="bookings">
     </div>
    </div>
   </section>
  </main>
  <script src="admin.js" type="module">
  </script>
 </body>
</html>
